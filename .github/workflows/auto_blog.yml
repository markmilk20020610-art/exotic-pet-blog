name: Auto Generate Blog Articles

# Content-factory cadence: one run every two days, four guides rewritten by
# DeepSeek. Four is the batch size the affiliate placement and the compliance
# audit were tuned against — raise --batch and check the build summary line
# ("affiliate: N products, M in-article cards") before trusting it.
on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'How many existing guides to regenerate (blank = 4)'
        required: false
        default: '4'
      grow:
        description: 'How many NEW topics to publish from topics.py (blank = 2)'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run generation script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          SITE_URL: "https://exotic-pet-blog.markmilk20020610.workers.dev"
        run: |
          python generate.py --refresh \
            --batch "${{ github.event.inputs.batch || 4 }}" \
            --grow "${{ github.event.inputs.grow || 2 }}"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # No "[skip ci]" here. This workflow only runs on schedule and
          # workflow_dispatch, so a push could never retrigger it anyway — but
          # Cloudflare Workers Builds *does* honour the marker, so tagging the
          # commit suppressed the deploy. Generated articles were committed and
          # then never reached production; the site only moved when a human
          # pushed an ordinary commit on top.
          git commit -m "content: auto-generate new guides via DeepSeek" || exit 0
          git push
